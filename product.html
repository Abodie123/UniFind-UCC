<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Product - UniFind UCC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f8f9fa}
.header{padding:12px;background:white;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}
.img-main{width:100%;height:320px;object-fit:contain;background:white}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px;background:white}
.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}
.thumbs img.active{border-color:#7C3AED}
.box{background:white;margin:10px;border-radius:16px;padding:14px}
.price{color:#7C3AED;font-weight:800;font-size:20px}
.vendor{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;font-size:13px}
.vendor b{font-size:14px}
.verify-badge{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:900}
.v-blue{background:#3B82F6}.v-gold{background:#F59E0B}.v-red{background:#DC2626}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px}
.btn-whatsapp{background:#25D366;color:white}
.btn-call{background:linear-gradient(90deg,#7C3AED,#F97316);color:white}
#map{height:200px;border-radius:12px;margin-top:10px}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div class="header"><a href="index.html" style="text-decoration:none;color:#7C3AED;font-weight:700">← Back</a><b>UniFind</b><span></span></div>
<img id="mainImg" class="img-main" src="icon-192.png">
<div class="thumbs" id="thumbs"></div>

<div class="box">
<h2 id="title">Loading...</h2>
<div class="price" id="price"></div>
<div class="vendor" id="vendor"></div>
<p id="desc" style="margin-top:10px;font-size:13px;color:#444;line-height:1.6"></p>
<p id="loc" style="margin-top:8px;font-size:12px;color:#888"></p>
</div>

<div class="box">
<h3 style="color:#7C3AED">📍 Location</h3>
<div id="map"></div>
</div>

<div class="box">
<button id="whatsappBtn" class="btn btn-whatsapp">💬 Contact Vendor on WhatsApp to Buy</button>
<button id="callBtn" class="btn btn-call">📞 Call Vendor</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA80kyQ6WamIeJ9M9-ycfjlGVSC6_KMLM1Q", authDomain: "unifind-ucc.firebaseapp.com", projectId: "unifind-ucc", storageBucket: "unifind-ucc.firebasestorage.app", messagingSenderId: "741083895005", appId: "1:741083895005:web:5598c8f39eea0d690ff734" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);

function getBadge(amount){
 amount=Number(amount||0);
 if(amount>=200) return {cls:'v-red', text:'Red Verified • Most Trusted'};
 if(amount>=100) return {cls:'v-gold', text:'Gold Verified'};
 if(amount>=50) return {cls:'v-blue', text:'Blue Verified'};
 return null;
}

async function load(){
 const params = new URLSearchParams(location.search);
 const id = params.get('id');
 if(!id){ document.getElementById('title').textContent='No product ID'; return; }
 const snap = await getDoc(doc(db,"products",id));
 if(!snap.exists()){ document.getElementById('title').textContent='Product not found'; return; }
 const p = snap.data();
 // ALL 4 IMAGES - main is first, but show all here
 const imgs = (p.images && p.images.length) ? p.images.filter(Boolean) : [p.image || p.imageUrl || p.mainImage].filter(Boolean);
 document.getElementById('title').textContent = p.title;
 document.getElementById('price').textContent = 'GH₵'+p.price;
 document.getElementById('desc').textContent = p.desc || p.description || '';
 document.getElementById('loc').textContent = '📍 '+p.location + ' • '+ (p.category||'');

 if(imgs[0]) document.getElementById('mainImg').src = imgs[0];
 const thumbs = document.getElementById('thumbs');
 thumbs.innerHTML='';
 imgs.forEach((im,i)=>{
   const t = document.createElement('img'); t.src=im; if(i===0) t.classList.add('active');
   t.onclick=()=>{ document.getElementById('mainImg').src=im; document.querySelectorAll('.thumbs img').forEach(x=>x.classList.remove('active')); t.classList.add('active'); };
   thumbs.appendChild(t);
 });

 const badge = getBadge(p.verificationAmount);
 // FIXED: REAL VENDOR NAME + BADGE ATTACHED
 const realName = p.vendorName || 'UCC Vendor';
 let vendorHtml = `<b>${realName}</b> `;
 if(badge){ vendorHtml+=`<span class="verify-badge ${badge.cls}">✔</span> <span style="color:#3B82F6;font-weight:700;font-size:11px">${badge.text}</span>`; }
 else { vendorHtml+=`<span style="color:#888;font-size:11px">• Unverified</span>`; }
 document.getElementById('vendor').innerHTML = vendorHtml;

 let map = L.map('map').setView([p.lat||5.115, p.lng||-1.2823],14);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
 if(p.lat&&p.lng) L.marker([p.lat,p.lng]).addTo(map).bindPopup(`${p.title}<br>${realName}<br>GH₵${p.price}`).openPopup();

 const phone = (p.phone||'').replace(/\D/g,''); 
 let waPhone = phone.startsWith('0') ? '233'+phone.slice(1) : phone;
 document.getElementById('whatsappBtn').onclick=()=>{
   const msg = encodeURIComponent(`Hi ${realName}, I'm interested in your ${p.title} for GH₵${p.price} on UniFind UCC. Is it still available? ${location.href}`);
   window.open(`https://wa.me/${waPhone}?text=${msg}`,'_blank');
 };
 document.getElementById('callBtn').onclick=()=>{ window.location.href='tel:'+p.phone; };
}
load();
</script>
</body>
</html>
