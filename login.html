<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | UniFind-UCC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brandPurple:'#7C3AED',brandTeal:'#0D9488',brandBg:'#F5F3FF'}}}}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-brandBg min-h-screen flex items-center justify-center px-4">
<div class="bg-white w-full max-w-md rounded-[2rem] p-8 border shadow-sm">
<div class="text-center mb-6"><div class="w-12 h-12 bg-brandPurple rounded-xl mx-auto flex items-center justify-center text-white"><i class="fa-solid fa-store"></i></div><h1 class="font-black text-2xl text-brandPurple mt-3">Welcome to UniFind</h1><p class="text-sm text-gray-500">Login to sell - Your name + ✔️ badge shows to students</p></div>

<input id="name" type="text" placeholder="Your full name e.g. Kwame Mensah" class="w-full border rounded-xl p-3 mb-3">
<input id="email" type="email" placeholder="UCC email e.g. kwame@gmail.com" class="w-full border rounded-xl p-3 mb-3">
<input id="password" type="password" placeholder="Password (min 6 chars)" class="w-full border rounded-xl p-3 mb-4">
<button id="loginBtn" class="w-full bg-brandPurple text-white py-3 rounded-full font-bold">Login / Sign Up</button>
<p id="status" class="text-xs text-center mt-3 text-brandPurple"></p>
<p class="text-xs text-center mt-4 text-gray-500">No separate signup file needed - this does both!</p>
<p class="text-center mt-3"><a href="index.html" class="text-sm text-brandTeal font-bold">Back to Market</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA80kyQ6Wam1ejM9-ycfjlGVSC6_KMLM1Q",
  authDomain: "unifind-ucc.firebaseapp.com",
  projectId: "unifind-ucc",
  storageBucket: "unifind-ucc.firebasestorage.app",
  messagingSenderId: "741083895005",
  appId: "1:741083895005:web:5598c8f39eea0d690ff734"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById('loginBtn').onclick=async()=>{
 const name = document.getElementById('name').value.trim();
 let e=document.getElementById('email').value.trim().toLowerCase();
 const p=document.getElementById('password').value.trim();
 const status = document.getElementById('status');
 
 if(!e || !p){ alert("Enter email and password"); return; }
 if(!e.includes('@')){ alert("Email must have @ like kwame@gmail.com"); return; }
 if(p.length<6){ alert("Password min 6 chars"); return; }
 
 status.textContent = "Please wait...";
 try{ 
   const cred = await signInWithEmailAndPassword(auth,e,p);
   if(name){ try{ await updateProfile(cred.user, {displayName: name}); }catch{} localStorage.setItem('vendorName', name); } 
   else { localStorage.setItem('vendorName', cred.user.displayName || e.split('@')[0]); }
   status.textContent = "✅ Login success! Going to sell page...";
   setTimeout(()=> location.href='vendor.html', 800);
 }catch(err){ 
   if(err.code==='auth/user-not-found' || err.code==='auth/invalid-credential' || err.code==='auth/invalid-login-credentials'){
     try{
       const cred2 = await createUserWithEmailAndPassword(auth,e,p);
       if(name){ try{ await updateProfile(cred2.user, {displayName: name}); }catch{} localStorage.setItem('vendorName', name); } 
       else { localStorage.setItem('vendorName', e.split('@')[0]); }
       status.textContent = "✅ Account created! Going to sell page...";
       setTimeout(()=> location.href='vendor.html', 800);
     }catch(e2){ status.textContent="❌ "+e2.message; alert(e2.message); }
   } else {
     status.textContent="❌ "+err.message;
     alert(err.message);
   }
 }
};
</script>
</body>
</html>
